<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <h1>프런트엔드 개발자 지원서</h1>
    <p>HTML, CSS, JavaScript에 대한 기술적 이해와 경험이 있는 분을 찾습니다.</p>
    <hr>
    <h3>개인정보</h3>
    <ul>
        <label for="name">이름 : <input size="20" type="text" " id="name" autofocus required></label>
        <br><label for="password">비밀번호 : <input size="20" type="password"  id="password"></label>
    </ul>
    <h3>지원 분야</h3>
    <ul>
        <input type="radio" name="field" ><label for="frontend">웹 퍼블리싱</label><br>
        <input type="radio" name="field"><label for="backend">웹 어플리케이션 개발</label><br>
        <input type="radio" name="field" ><label for="fullstack">개발 환경 개선</label><br>
    </ul>
    <h3>지원 동기</h3>
    <label for="memo"> : <textarea name="memo" placeholder="본사 지원 동기를 간략히 써 주세요"id="memo" cols="50" rows="5"></textarea></label>
    <div>
            <input type="submit" value="접수하기">
            <input type="reset" value="다시쓰기">
    </div>
    </fieldset>
</body>
</html>
