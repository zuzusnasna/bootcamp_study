<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-transform</title>
  <style>    
  /* Do it! 영문자의 대소문자 변환하기 */
  transform1{
    text-transform: uppercase;
  }
  transform2{
    text-transform: lowercase;
  }
  transform3{
    text-transform: capitalize;
  }
  </style>
</head>
<body>
  <p class="transform1">html</p> 
  <p class="transform2">css</p>
  <p class="transform3">JAVASCRIPT</p>
</body>
</html>
