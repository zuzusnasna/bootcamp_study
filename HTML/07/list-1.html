<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>불릿과 번호 바꾸기</title>
  <style>
    /* Do it! 목록의 불릿과 번호 바꾸기 */
    .book1{
      list-style-type: none;
    }
    .book2{
      list-style-type: upper-alpha;
    }
    .book3{
      list-style-type: circle;
    }
  </style>
</head>
<body>
  <h1>도서 시리즈</h1>
  <ul>
    <li class="book1">Do it! 시리즈</li>
    <li class="book2">된다 시리즈</li>
    <li class="book3">DCM 프로 사진가</li>
    <li>데이터과학 시리즈</li>
  </ul>

  <ol>
    <li class="book1">Do it! 시리즈</li>
    <li class="book2">된다 시리즈</li>
    <li class="book3">DCM 프로 사진가</li>
    <li>데이터과학 시리즈</li>
  </ol>
</body>
</html>
