<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <!-- 글자 크기 지정하기 - 절대 크기 -->
   <style>
    @import url('https://fonts.googleapis.com/css2?family=Dokdo&display=swap');
    h1{
      /* font-size : 40px; */
      font-family : '고딕';
      font-size : 3em;
    }
    .accent{
      font-size : 1.5em;
      font-weight : 900;
    }
    .italic{
      font-family: "Dokdo", system-ui;
      font-style : italic;
      font-weight : 900;
    }
    p{
      font-size : 20px;
    }
    </style>
  
</head>
<body>
  <h1 class="accent">레드향</h1>
  <p class="italic">껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다.</p>
  <p>레드향은 한라봉과 귤을 교배한 것으로</p>
  <p>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>      
</body>
</html>
