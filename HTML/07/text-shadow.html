<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-shadow</title>
  <style>    
    h1 { 
      font-size:60px;
    } 
    /* Do it! text-shadow 속성으로 텍스트 그림자 추가하기 */
  .shadow1{
    color: red;
    text-shadow: 2px 2px black;
  }
  .shadow2{
    color: blue;
    text-shadow: 5px 5px 3px black, 4px 4px gray;
  }
  .shadow3{
    color: green;
    text-shadow: 5px 5px 3px black, 4px 4px gray, 3px 3px white;
  }
  </style>
</head>
<body>
  <h1 class="shadow1">HTML</h1> 
  <h1 class="shadow2">CSS</h1>
  <h1 class="shadow3">자바스크립트</h1>
</body>
</html>
