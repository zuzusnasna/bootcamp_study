<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>letter-spacing</title>
    <style>  
      p {
        font-size:80px;
      }
      /* Do it! 글자 간격 조절하기 */
      .spacing1{
        letter-spacing: 0.2em;
      }
      .spacing2{
        letter-spacing: 0.5em;
      }
      .spacing3{
        letter-spacing: 1em;
      }
    </style>
  </head>
  <body>
    <ps>CSS</ps> 
    <p class="spacing1">CSS</p>
    <p class="spacing2">CSS</p>
    <p class="spacing3">CSS</p>
  </body>
</html>
